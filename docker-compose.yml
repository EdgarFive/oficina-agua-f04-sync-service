
services:

  dynamodb:
    image: amazon/dynamodb-local:latest
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    user: "root"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  sync-service:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local

      # MariaDB original ejecutada en Windows
      F04_DB_URL: jdbc:mariadb://host.docker.internal:3308/oficina_agua
      F04_DB_USER: f04_local_ro
      F04_DB_PASSWORD: ${F04_LOCAL_DB_PASSWORD}

      # DynamoDB ejecutado dentro de Docker
      F04_DYNAMODB_ENDPOINT: http://dynamodb:8000

    ports:
      - "127.0.0.1:8081:8080"

    depends_on:
      dynamodb:
        condition: service_started

    restart: on-failure

volumes:
  dynamodb_data:
