services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: oficina_agua
      MARIADB_ROOT_PASSWORD: ${F04_DOCKER_ROOT_PASSWORD}
      MARIADB_USER: f04_docker_ro
      MARIADB_PASSWORD: ${F04_DOCKER_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  dynamodb:
    image: amazon/dynamodb-local:latest
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    user: "root"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  sync-service:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      F04_DB_URL: jdbc:mariadb://mariadb:3306/oficina_agua
      F04_DB_USER: f04_docker_ro
      F04_DB_PASSWORD: ${F04_DOCKER_DB_PASSWORD}
      F04_DYNAMODB_ENDPOINT: http://dynamodb:8000
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      dynamodb:
        condition: service_started
    restart: on-failure

volumes:
  mariadb_data:
  dynamodb_data:
